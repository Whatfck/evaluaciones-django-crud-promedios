<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - Calificaciones</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
        }
        .logo {
            text-align: center;
            font-size: 50px;
            margin-bottom: 10px;
        }
        h1 {
            color: #333;
            margin-bottom: 25px;
            text-align: center;
            font-size: 28px;
        }
        form { display: flex; flex-direction: column; gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 5px; color: #555; }
        input {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
        }
        input:focus { outline: none; border-color: #667eea; }
        .helptext { font-size: 11px; color: #888; margin-top: 4px; line-height: 1.4; }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
        .footer-links { text-align: center; margin-top: 25px; font-size: 14px; color: #666; }
        .footer-links a { color: #667eea; text-decoration: none; font-weight: 600; }
        .footer-links a:hover { text-decoration: underline; }
        .errorlist { color: #e53e3e; list-style: none; font-size: 12px; margin-top: 5px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📝</div>
        <h1>Crear Cuenta</h1>

        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.help_text %}
                    <div class="helptext">{{ field.help_text|safe }}</div>
                {% endif %}
                {% if field.errors %}
                    <div class="errorlist">{{ field.errors }}</div>
                {% endif %}
            </div>
            {% endfor %}
            <button type="submit">✨ Registrarse</button>
        </form>

        <div class="footer-links">
            ¿Ya tienes una cuenta? <a href="{% url 'calificaciones:login' %}">Inicia sesión</a>
        </div>
    </div>
</body>
</html>
