<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Calificación</title>
</head>
<body>
    <h1>¿Estás seguro de que quieres eliminar esta calificación?</h1>
    <p>Estudiante: {{ calificacion.nombre_estudiante }}</p>
    <p>Asignatura: {{ calificacion.asignatura }}</p>
    <p>Promedio: {{ calificacion.promedio }}</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Eliminar</button>
        <a href="{% url 'calificaciones:listar_calificaciones' %}">Cancelar</a>
    </form>
</body>
</html>
